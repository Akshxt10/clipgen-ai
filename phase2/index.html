<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#06080e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ClipGen AI">
<title>ClipGen AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7bff'/%3E%3Cstop offset='1' stop-color='%232fd4f0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M24 18l22 14-22 14z' fill='%2306080e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<header class="appbar">
  <a class="brand" href="#/" aria-label="ClipGen AI home">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="28" height="28"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#2fd4f0"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><path d="M24 18l22 14-22 14z" fill="#06080e"/></svg>
    </span>
    <span class="brand-name">ClipGen <b>AI</b></span>
  </a>
  <div class="appbar-right">
    <span class="pill pill-phase">Phase 2</span>
    <button id="storageChip" class="chip" type="button" aria-live="polite">Checking storage…</button>
  </div>
</header>

<main id="view" class="wrap" aria-live="polite"></main>

<footer class="foot wrap">
  <p>Free &amp; private: your video files stay on this device and are never uploaded. YouTube videos appear only inside YouTube’s own player. · <span id="appVersion"></span></p>
</footer>

<div id="busy" class="busy hidden" role="status" aria-live="assertive">
  <div class="busy-card"><div class="spinner" aria-hidden="true"></div><div id="busyText">Working…</div></div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<noscript><div class="wrap"><div class="banner banner-bad"><b>JavaScript is off</b>ClipGen AI needs JavaScript.</div></div></noscript>
<script nomodule>document.getElementById('view').innerHTML='<div class="wrap"><div class="banner banner-bad"><b>Browser too old</b>Please update iOS / Safari (iOS 15 or newer is recommended).</div></div>';</script>
<script type="module" src="app.js?v=2"></script>
</body>
</html>
